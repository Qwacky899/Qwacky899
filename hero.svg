      <circle cx="19" cy="17" r="5" fill="#67E8F9" filter="url(#tinyGlow)"/>
      <text x="34" y="22" fill="#CDD6F4" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" letter-spacing="1.6">BUILDING ROBLOX EXPERIENCES LIKE PRODUCTS</text>

      <text x="0" y="112" fill="#FFFFFF" font-size="58" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" letter-spacing="-1.6">HARRY SMITH</text>
      <text x="0" y="171" fill="url(#accent)" font-size="43" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="760" letter-spacing="-1.2">ROBLOX PRODUCT &amp; GAME DEVELOPER</text>

      <text x="0" y="226" fill="#AEB8D2" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500">Systems · UI/UX · Product design · Commercial game development</text>

      <g transform="translate(0 270)">
        <rect width="143" height="43" rx="13" fill="#A78BFA" fill-opacity="0.11" stroke="#A78BFA" stroke-opacity="0.35"/>
        <text x="18" y="27" fill="#E9E2FF" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" letter-spacing="0.8">QWACKY899</text>
        <rect x="155" width="158" height="43" rx="13" fill="#67E8F9" fill-opacity="0.08" stroke="#67E8F9" stroke-opacity="0.28"/>
        <text x="174" y="27" fill="#D7FAFF" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" letter-spacing="0.8">UNITED KINGDOM</text>
      </g>
    </g>

    <g transform="translate(955 52)">
      <rect x="10" y="18" width="345" height="292" rx="28" fill="#000000" fill-opacity="0.24"/>
      <rect width="365" height="316" rx="30" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <rect x="1" y="1" width="363" height="314" rx="29" stroke="url(#accent)" stroke-opacity="0.18"/>

      <g transform="translate(29 27)">
        <circle cx="7" cy="7" r="7" fill="#F472B6" fill-opacity="0.9"/>
        <circle cx="29" cy="7" r="7" fill="#A78BFA" fill-opacity="0.9"/>
        <circle cx="51" cy="7" r="7" fill="#67E8F9" fill-opacity="0.9"/>
        <rect x="190" y="1" width="116" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.08"/>
      </g>

