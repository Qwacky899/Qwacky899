        <path d="M233 56L257 42L281 56L257 70L233 56Z" fill="#A78BFA" fill-opacity="0.28" stroke="#C4B5FD" stroke-opacity="0.82"/>
        <path d="M233 56V30L257 17L281 30V56" stroke="#67E8F9" stroke-opacity="0.88" stroke-width="1.5"/>
        <path d="M233 30L257 43L281 30M257 43V70" stroke="#F9A8D4" stroke-opacity="0.76" stroke-width="1.5"/>
      </g>

      <g transform="translate(29 177)">
        <rect width="307" height="44" rx="14" fill="#090D1B" fill-opacity="0.64" stroke="#FFFFFF" stroke-opacity="0.09"/>
        <circle cx="24" cy="22" r="7" fill="#A78BFA"/>
        <text x="43" y="27" fill="#E8ECF8" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="650">GAME SYSTEMS</text>
        <rect x="224" y="17" width="59" height="10" rx="5" fill="#A78BFA" fill-opacity="0.20"/>
        <rect x="224" y="17" width="44" height="10" rx="5" fill="#A78BFA"/>

        <rect y="54" width="307" height="44" rx="14" fill="#090D1B" fill-opacity="0.64" stroke="#FFFFFF" stroke-opacity="0.09"/>
        <circle cx="24" cy="76" r="7" fill="#F472B6"/>
        <text x="43" y="81" fill="#E8ECF8" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="650">INTERFACE &amp; UX</text>
        <rect x="224" y="71" width="59" height="10" rx="5" fill="#F472B6" fill-opacity="0.20"/>
