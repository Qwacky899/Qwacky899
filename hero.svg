<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Harry Smith — Roblox Product and Game Developer</title>
  <desc id="desc">A premium midnight indigo banner with violet and cyan accents, interface cards, and geometric game-development motifs.</desc>
  <defs>
    <linearGradient id="bg" x1="35" y1="28" x2="1360" y2="396" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070A12"/>
      <stop offset="0.48" stop-color="#10162B"/>
      <stop offset="1" stop-color="#080B16"/>
    </linearGradient>
    <linearGradient id="accent" x1="480" y1="65" x2="1035" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.52" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="glass" x1="956" y1="76" x2="1267" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.035"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1049 90) rotate(119.6) scale(250 310)">
      <stop stop-color="#8B5CF6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1270 331) rotate(-149) scale(240 305)">
      <stop stop-color="#22D3EE" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#FFFFFF" stroke-opacity="0.045"/>
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.08"/>
    </pattern>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="tinyGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip">
      <rect width="1400" height="420" rx="34"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1400" height="420" rx="34" fill="url(#bg)"/>
    <rect width="1400" height="420" fill="url(#grid)"/>
    <ellipse cx="1050" cy="83" rx="315" ry="240" fill="url(#violetGlow)"/>
    <ellipse cx="1275" cy="356" rx="300" ry="235" fill="url(#cyanGlow)"/>
    <circle cx="975" cy="68" r="96" fill="#8B5CF6" fill-opacity="0.16" filter="url(#blur)"/>
    <circle cx="1290" cy="350" r="105" fill="#22D3EE" fill-opacity="0.13" filter="url(#blur)"/>

    <g opacity="0.5">
      <path d="M0 342C237 271 431 327 664 381C879 431 1119 417 1400 308" stroke="url(#accent)" stroke-opacity="0.20" stroke-width="1.5"/>
      <path d="M0 363C249 292 434 344 650 392" stroke="#A78BFA" stroke-opacity="0.08"/>
    </g>

    <g transform="translate(72 58)">
