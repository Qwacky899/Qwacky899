        <text x="18" y="30" fill="#93A3C7" font-size="11" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" letter-spacing="1.5">CURRENT BUILD</text>
        <text x="18" y="58" fill="#FFFFFF" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="780">STYLE IT</text>
        <rect x="18" y="70" width="89" height="5" rx="2.5" fill="url(#accent)"/>
        <rect x="115" y="70" width="57" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.10"/>

