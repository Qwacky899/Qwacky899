<svg width="1400" height="360" viewBox="0 0 1400 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Harry Smith — Roblox Developer</title>
  <desc id="desc">Minimal midnight banner with violet, pink and cyan accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B14"/>
      <stop offset="0.55" stop-color="#11162A"/>
      <stop offset="1" stop-color="#090C16"/>
    </linearGradient>
    <linearGradient id="accent" x1="520" y1="70" x2="1140" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1115 82) rotate(132) scale(300 360)">
      <stop stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1300 310) rotate(-145) scale(250 320)">
      <stop stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="clip"><rect width="1400" height="360" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1400" height="360" rx="30" fill="url(#bg)"/>
    <rect width="1400" height="360" fill="url(#grid)"/>
    <ellipse cx="1110" cy="80" rx="330" ry="230" fill="url(#glow1)"/>
    <ellipse cx="1300" cy="320" rx="280" ry="210" fill="url(#glow2)"/>

    <g transform="translate(76 66)">
      <rect width="152" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <circle cx="18" cy="15" r="4" fill="#67E8F9"/>
      <text x="31" y="20" fill="#CCD5EE" font-size="12" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" letter-spacing="1.2">QWACKY899</text>

      <text x="0" y="102" fill="#FFFFFF" font-size="58" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" letter-spacing="-1.6">I BUILD ROBLOX GAMES.</text>
      <rect x="0" y="128" width="520" height="4" rx="2" fill="url(#accent)"/>
      <text x="0" y="177" fill="#AFB9D2" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500">Systems · UI/UX · Product · Full-stack development</text>
      <text x="0" y="219" fill="#7F8AA8" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" letter-spacing="1.0">HARRY SMITH</text>
    </g>

    <g transform="translate(1040 70)" opacity="0.95">
      <path d="M110 0L220 64V190L110 254L0 190V64L110 0Z" stroke="url(#accent)" stroke-opacity="0.50" stroke-width="2"/>
      <path d="M0 64L110 128L220 64M110 128V254" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
      <path d="M38 85L110 43L182 85L110 127L38 85Z" fill="#A78BFA" fill-opacity="0.07" stroke="#C4B5FD" stroke-opacity="0.24"/>
      <circle cx="110" cy="128" r="5" fill="#F472B6"/>
      <circle cx="220" cy="64" r="4" fill="#67E8F9"/>
      <circle cx="0" cy="190" r="4" fill="#A78BFA"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1398.5" height="358.5" rx="29.25" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.5"/>
