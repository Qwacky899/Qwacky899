        <rect y="108" width="307" height="44" rx="14" fill="#090D1B" fill-opacity="0.64" stroke="#FFFFFF" stroke-opacity="0.09"/>
        <circle cx="24" cy="130" r="7" fill="#67E8F9"/>
        <text x="43" y="135" fill="#E8ECF8" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="650">PRODUCT &amp; GROWTH</text>
        <rect x="224" y="125" width="59" height="10" rx="5" fill="#67E8F9" fill-opacity="0.20"/>
        <rect x="224" y="125" width="47" height="10" rx="5" fill="#67E8F9"/>
