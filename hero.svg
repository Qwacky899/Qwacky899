    <path d="M1366 31H1280" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
    <path d="M34 389H203" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
